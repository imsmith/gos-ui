<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- Design-system marks. 24x24 grid, 2px monoline, round caps/joins, outline.
       Color via currentColor (set `color` on the consuming element).
       Reference with: <svg><use href="sprite.svg#m-NAME"/></svg>
       Defaults applied per symbol; inner fills override to currentColor/none. -->

  <!-- ============ STATUS (sign-shape semantics) ============ -->
  <symbol id="m-critical" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="8,2 16,2 22,8 22,16 16,22 8,22 2,16 2,8"/>
      <line x1="9" y1="9" x2="15" y2="15"/><line x1="15" y1="9" x2="9" y2="15"/>
    </g>
  </symbol>
  <symbol id="m-high" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,3 22,21 2,21"/>
      <line x1="12" y1="10" x2="12" y2="15"/>
      <circle cx="12" cy="18" r="1" fill="currentColor" stroke="none"/>
    </g>
  </symbol>
  <symbol id="m-medium" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12,2 22,12 12,22 2,12"/>
      <line x1="12" y1="9" x2="12" y2="14"/>
      <circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/>
    </g>
  </symbol>
  <symbol id="m-low" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <polyline points="7,12 11,16 17,8"/>
    </g>
  </symbol>
  <symbol id="m-unknown" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="3"/>
      <text x="12" y="17" font-size="13" font-family="monospace" fill="currentColor" stroke="none" text-anchor="middle">?</text>
    </g>
  </symbol>

  <!-- ============ DIVERGING (temperature direction) ============ -->
  <symbol id="m-warm" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6,15 12,8 18,15"/>
    </g>
  </symbol>
  <symbol id="m-neutral" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="12" x2="18" y2="12"/>
    </g>
  </symbol>
  <symbol id="m-cool" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="6,9 12,16 18,9"/>
    </g>
  </symbol>

  <!-- ============ UI (functional starter set) ============ -->
  <symbol id="m-close" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="18" y1="6" x2="6" y2="18"/></g></symbol>
  <symbol id="m-menu" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></g></symbol>
  <symbol id="m-chevron" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9,5 16,12 9,19"/></g></symbol>
  <symbol id="m-more" viewBox="0 0 24 24"><g stroke="none" fill="currentColor"><circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/></g></symbol>
  <symbol id="m-search" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6"/><line x1="14.5" y1="14.5" x2="20" y2="20"/></g></symbol>
  <symbol id="m-add" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></g></symbol>
  <symbol id="m-remove" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/></g></symbol>
  <symbol id="m-edit" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20v-4L16 4l4 4L8 20z"/><line x1="14" y1="6" x2="18" y2="10"/></g></symbol>
  <symbol id="m-delete" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="4,7 20,7"/><path d="M9 7V5h6v2"/><path d="M6 7l1 14h10l1-14"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></g></symbol>
  <symbol id="m-refresh" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="21 4 21 9 16 9"/><path d="M18.7 14a7.5 7.5 0 1 1-1.77-7.8L21 9"/></g></symbol>
  <symbol id="m-filter" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,5 21,5 14,13 14,19 10,16 10,13 3,5"/></g></symbol>
  <symbol id="m-download" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="4" x2="12" y2="15"/><polyline points="8,11 12,15 16,11"/><polyline points="5,18 5,20 19,20 19,18"/></g></symbol>
  <symbol id="m-upload" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="20" x2="12" y2="9"/><polyline points="8,13 12,9 16,13"/><polyline points="5,6 5,4 19,4 19,6"/></g></symbol>
  <symbol id="m-settings" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 9.5 21.8 10.1 21.8 13.9 18 14.5 20.3 17.6 17.6 20.3 14.5 18 13.9 21.8 10.1 21.8 9.5 18 6.4 20.3 3.7 17.6 6 14.5 2.2 13.9 2.2 10.1 6 9.5 3.7 6.4 6.4 3.7 9.5 6 10.1 2.2 13.9 2.2 14.5 6 17.6 3.7 20.3 6.4Z"/><circle cx="12" cy="12" r="3"/></g></symbol>
  <symbol id="m-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="11" x2="12" y2="17"/><circle cx="12" cy="7.5" r="1" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="m-help" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><circle cx="12" cy="17" r="1" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="m-user" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M5 20a7 7 0 0 1 14 0"/></g></symbol>
  <symbol id="m-lock" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.2" fill="currentColor" stroke="none"/></g></symbol>
  <symbol id="m-bell" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></g></symbol>
</svg>
